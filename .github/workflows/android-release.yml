name: Android release APK

# Builds a release APK on a GitHub runner so nothing has to be installed locally.
# Signing: the repo's android/app/build.gradle signs the release build type with
# signingConfigs.debug. That means the APK this produces carries the default
# Android debug keystore, NOT a release key. Consequences are spelled out in
# specs/fivetone-custom-exercises-recon-20261104.md and in the README note below.

on:
  workflow_dispatch:
  push:
    # feature/** is here so the build can be proven on a branch without
    # touching main. Remove it once the workflow is trusted there.
    branches: [main, 'feature/**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-release.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 is deliberate. The project pins AGP 7.3.0 and Gradle 7.5 in
      # android/, and Gradle 7.5 cannot run on JDK 21+. Bumping either of those
      # is a separate change; matching the toolchain to them is not.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3.16.5 exactly: pubspec.yaml declares `flutter: 3.16.5` as an exact SDK
      # constraint, so a newer Flutter fails resolution rather than warning.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # `pub get` honours pubspec.lock, so CI resolves the same pinned versions
      # that are committed (including the 3.0.0-dev.3 Riverpod prereleases,
      # which are still published and not retracted).
      - name: Resolve dependencies
        run: flutter pub get

      # No code generation step: the repo has no `part` directives and
      # lib/routes.g.dart is committed. If that ever changes, build_runner
      # needs adding here.
      - name: Build release APK
        run: flutter build apk --release

      - name: Report artefact
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "---"
          # Record the certificate so the signing situation is visible in the log
          # rather than assumed.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" print-certs build/app/outputs/flutter-apk/app-release.apk || true
          else
            unzip -l build/app/outputs/flutter-apk/app-release.apk | head -5
            echo "apksigner not found under ANDROID_HOME; certificate not dumped"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Tests run AFTER the upload on purpose: a failing test should show up
      # loudly and turn the run red, but it must not cost the artefact, because
      # the APK is the thing being installed. Ordering the steps this way is
      # deliberate, not accidental.
      - name: Run unit tests
        run: flutter test test/
